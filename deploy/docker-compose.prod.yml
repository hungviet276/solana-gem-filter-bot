services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.9.1-alpine}
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN for production TLS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

