name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock && python -m pip install -e . --no-deps
      - run: pytest --cov=gem_filter.domain --cov-fail-under=90
      - run: ruff check src tests
      - run: mypy src/gem_filter/domain src/gem_filter/application/backtest.py
      - run: python ops/check_no_trading.py
      - run: APP_ENV=prod python ops/check_image_digests.py
        env:
          PYTHON_BASE_IMAGE: registry.invalid/python@sha256:test
          POSTGRES_IMAGE: registry.invalid/postgres@sha256:test
          REDIS_IMAGE: registry.invalid/redis@sha256:test
          PROMETHEUS_IMAGE: registry.invalid/prometheus@sha256:test
          GRAFANA_IMAGE: registry.invalid/grafana@sha256:test
          CADDY_IMAGE: registry.invalid/caddy@sha256:test
          APP_IMAGE: registry.invalid/gem-filter@sha256:test
      - run: docker compose --env-file .env.example config
      - run: docker build -t gem-filter:test .
